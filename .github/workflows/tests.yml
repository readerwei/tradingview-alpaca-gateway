name: tests

# Every "verified" claim on this repository has so far been someone running
# pytest on their own machine and reporting the number. That produced three
# failures worth preventing:
#
#   * 88 tests passing while two agreed constraints were absent from the code
#   * "100 passed" reported against a branch a clean clone runs as 98 — two
#     tests existed in one environment and nowhere else
#   * a pull request reported CLEAN and recommended for merge while six of its
#     tests failed, because GitHub's "clean" means no merge CONFLICTS and says
#     nothing about test health
#
# A clean checkout on a machine belonging to neither author is the cheapest
# fix for all three.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read          # no write access; this job only reads and reports

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --extra test --frozen

      - name: Run the full suite
        run: uv run pytest -q

      # Deliberately absent: any Alpaca credential, any network call to a
      # broker, and any step that could place an order. The suite must pass
      # with no secrets configured at all — if it ever needs one, that is a
      # test reaching the outside world and should be caught here.
