[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingview-alpaca-gateway"
version = "0.1.0"
description = "Paper-only TradingView webhook gateway for Alpaca order simulation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
relay = [
  "discord.py>=2.4,<3",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
tv-alpaca-gateway = "tv_alpaca_gateway.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
